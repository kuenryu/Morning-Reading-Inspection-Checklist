<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨讀巡堂紀錄系統</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --bg: #f8f9fa;
            --border: #dee2e6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h3 {
            text-align: center;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }
        .form-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 8px;
        }
        label { font-weight: bold; }
        select, input[type="text"], input[type="number"] {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="number"] { width: 60px; }
        .checkbox-group {
            display: flex;
            gap: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .certification-badge {
            display: none;
            background: var(--success);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* 教室與座位表設計 (縮小版) */
        .classroom-wrapper {
            position: relative;
            margin: 30px 0;
            padding: 20px 60px 20px 20px; /* 右側留 60px 給門 */
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #f8f9fa;
        }
        .door {
            position: absolute;
            right: 0;
            width: 35px;
            height: 70px;
            background: #d35400; /* 木門顏色 */
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            letter-spacing: 5px;
            font-weight: bold;
            border-radius: 4px 0 0 4px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
        }
        .front-door { top: 30px; }
        .back-door { bottom: 30px; }
        
        .blackboard {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 5px;
            width: 70%;
            margin-left: auto;
            margin-right: auto;
        }
        .seating-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px; /* 緊湊間距 */
        }
        .seat {
            border: 1px solid #adb5bd;
            border-radius: 4px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            transition: background-color 0.2s;
        }
        .seat-header {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 3px;
        }
        .seat-label {
            font-size: 12px;
            color: #d35400; /* 紅字標示 */
            font-weight: bold;
        }
        .seat-select {
            width: 100%;
            font-size: 12px;
            padding: 1px;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: rgba(255,255,255,0.9);
        }

        /* 例外狀況統計 */
        .exceptions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .exception-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .btn-save {
            display: block;
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .btn-save:hover { background: #2980b9; }
        
        /* 底部統計表 */
        .summary-section { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 8px 4px;
            min-width: 40px;
            font-size: 14px;
        }
        th { background: #e9ecef; }
        .class-group-th { background: #ced4da; }
        .cert-check { font-size: 18px; color: var(--success); font-weight: bold; }
        .cert-input {
            width: 35px;
            text-align: center;
            border: 1px solid transparent;
            background: transparent;
            font-size: 14px;
        }
        .cert-input:hover, .cert-input:focus {
            border: 1px solid var(--accent);
            background: white;
        }
        
        /* 儲存提示框 */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 9999;
            display: none;
            font-weight: bold;
            animation: popIn 0.3s ease-out;
        }
    </style>
</head>
<body>

<div id="toast">儲存成功！</div>

<div class="container">
    <h1>晨讀巡堂紀錄系統</h1>

    <div class="form-group">
        <label>第 <input type="number" id="weekInput" value="1" min="1" onchange="updateSummaryWeek(); loadClassRecord();"> 週</label>
        
        <label>巡視紀錄者：</label>
        <select id="inspectorSelect" onchange="toggleManualInspector()">
            <option value="校長">校長</option>
            <option value="教務主任">教務主任</option>
            <option value="學務主任">學務主任</option>
            <option value="生教組長">生教組長</option>
            <option value="課發組長">課發組長</option>
            <option value="manual">手動輸入...</option>
        </select>
        <input type="text" id="manualInspector" placeholder="請輸入職稱/姓名" style="display:none;">

        <label style="margin-left: auto;">巡查班級：</label>
        <select id="classSelect" onchange="loadClassRecord()">
            <optgroup label="七年級">
                <option value="701">701</option><option value="702">702</option><option value="703">703</option>
                <option value="704">704</option><option value="705">705</option><option value="706">706</option>
            </optgroup>
            <optgroup label="八年級">
                <option value="801">801</option><option value="802">802</option><option value="803">803</option>
                <option value="804">804</option><option value="805">805</option><option value="806">806</option>
            </optgroup>
            <optgroup label="九年級">
                <option value="901">901</option><option value="902">902</option><option value="903">903</option>
                <option value="904">904</option><option value="905">905</option><option value="906">906</option>
                <option value="907">907</option>
            </optgroup>
        </select>
    </div>

    <div class="checkbox-group">
        <label class="checkbox-item">
            <input type="checkbox" id="chkQuiet" onchange="checkCertification()"> 1. 全班安靜閱讀
        </label>
        <label class="checkbox-item">
            <input type="checkbox" id="chkBooks" onchange="checkCertification()"> 2. 全班閱讀課外讀物
        </label>
        <span class="certification-badge" id="certBadge">✓ 通過認證</span>
    </div>

    <!-- 教室配置區 -->
    <div class="classroom-wrapper">
        <div class="door front-door">前門</div>
        <div class="blackboard">黑板 (正前方)</div>
        
        <div class="seating-grid" id="seatingGrid">
            <!-- JS 動態生成下拉式座位 -->
        </div>
        
        <div class="door back-door">後門</div>
    </div>

    <!-- 班級例外狀況統計 -->
    <h3>班級特殊狀況統計</h3>
    <div class="exceptions-grid">
        <div class="exception-item">
            <label>走動人數</label>
            <input type="number" id="excWalk" min="0" value="0">
        </div>
        <div class="exception-item">
            <label>打掃人數</label>
            <input type="number" id="excClean" min="0" value="0">
        </div>
        <div class="exception-item">
            <label>站立人數</label>
            <input type="number" id="excStand" min="0" value="0">
        </div>
        <div class="exception-item">
            <label>未就緒人數</label>
            <input type="number" id="excNotReady" min="0" value="0">
        </div>
        <div class="exception-item" style="grid-column: span 2;">
            <label>其他</label>
            <input type="text" id="excOther"> <!-- 已移除 placeholder -->
        </div>
    </div>

    <style>
        @media (max-width: 768px) {
            .seating-grid {
                grid-template-columns: repeat(3, 1fr); /* Break into 3 columns on smaller screens */
            }
            .classroom-wrapper {
                padding: 10px 40px 10px 10px;
            }
            .door {
                width: 25px;
                height: 50px;
                font-size: 10px;
            }
            .seat {
                padding: 2px;
            }
            .seat-select {
                font-size: 10px;
            }
        }
        @media (max-width: 480px) {
            .seating-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columns for phones */
            }
        }
    </style>

    <button class="btn-save" onclick="saveRecord()">儲存 / 更新本班紀錄</button>

    <!-- 底部週次統計表 -->
    <div class="summary-section">
        <h3>第 <span id="summaryWeekDisplay">1</span> 週 獲得認證獎狀統計表</h3>
        <table>
            <thead>
                <tr>
                    <th rowspan="2">班級</th>
                    <th colspan="6" class="class-group-th">七年級</th>
                    <th colspan="6" class="class-group-th">八年級</th>
                    <th colspan="7" class="class-group-th">九年級</th>
                </tr>
                <tr id="classHeaders">
                    <!-- JS 生成班級標頭 -->
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>本週通過認證</td>
                    <!-- JS 生成認證打勾區 -->
                </tr>
                <tr>
                    <td>通過認證週數<br>(第 __ 週)</td>
                    <!-- JS 生成手動輸入週數區 -->
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const classes = [
        "701","702","703","704","705","706",
        "801","802","803","804","805","806",
        "901","902","903","904","905","906","907"
    ];

    // 下拉選項與對應背景顏色
    const seatOptions = [
        { value: "正常", label: "正常", bg: "#ffffff" },
        { value: "看課內", label: "看課內", bg: "#ffeaa7" },
        { value: "寫考卷", label: "寫考卷", bg: "#55efc4" },
        { value: "寫聯絡簿", label: "寫聯絡簿", bg: "#74b9ff" },
        { value: "睡覺", label: "睡覺", bg: "#a29bfe" },
        { value: "桌上無書發呆", label: "桌上無書發呆", bg: "#ff7675" }
    ];

    // 儲存所有紀錄的記憶體物件
    const records = {};

    window.onload = () => {
        initSeatingGrid();
        initSummaryTable();
    };

    function toggleManualInspector() {
        const select = document.getElementById("inspectorSelect");
        const manualInput = document.getElementById("manualInspector");
        if (select.value === "manual") {
            manualInput.style.display = "inline-block";
            manualInput.focus();
        } else {
            manualInput.style.display = "none";
        }
    }

    function checkCertification() {
        const chkQuiet = document.getElementById("chkQuiet").checked;
        const chkBooks = document.getElementById("chkBooks").checked;
        const badge = document.getElementById("certBadge");
        badge.style.display = (chkQuiet && chkBooks) ? "inline-block" : "none";
    }

    // 建立 6x5 下拉式座位表 (右到左，前到後)
    function initSeatingGrid() {
        const grid = document.getElementById("seatingGrid");
        grid.innerHTML = "";
        
        // 直排為 1~5 (前到後)
        for (let row = 1; row <= 5; row++) {
            // 畫面橫排為從左到右 (視覺上的 1~6)，但邏輯上最右側(靠近門)是第1排
            for (let visualCol = 1; visualCol <= 6; visualCol++) {
                const seat = document.createElement("div");
                seat.className = "seat";

                // 計算邏輯上的排數：畫面最右側 (visualCol=6) 對應 排1
                const logicalCol = 7 - visualCol; 

                const header = document.createElement("div");
                header.className = "seat-header";

                // 座位標籤：排-列 (例如 1-1, 1-2...最左前是 6-1)
                const label = document.createElement("div");
                label.className = "seat-label";
                label.innerText = `${logicalCol}-${row}`;
                header.appendChild(label);

                // 狀態下拉選單
                const select = document.createElement("select");
                select.className = "seat-select";
                
                seatOptions.forEach(opt => {
                    const option = document.createElement("option");
                    option.value = opt.value;
                    option.innerText = opt.label;
                    select.appendChild(option);
                });

                select.onchange = function() {
                    const selectedOpt = seatOptions.find(o => o.value === this.value);
                    seat.style.backgroundColor = selectedOpt.bg;
                };

                seat.appendChild(header);
                seat.appendChild(select);
                grid.appendChild(seat);
            }
        }
    }

    function initSummaryTable() {
        const headerRow = document.getElementById("classHeaders");
        const tbodyRows = document.querySelectorAll(".summary-section tbody tr");
        const passRow = tbodyRows[0];
        const weekCountRow = tbodyRows[1];

        classes.forEach(cls => {
            const th = document.createElement("th");
            th.innerText = cls;
            headerRow.appendChild(th);

            const tdPass = document.createElement("td");
            tdPass.id = `pass_status_${cls}`;
            passRow.appendChild(tdPass);

            const tdCount = document.createElement("td");
            tdCount.innerHTML = `<input type="text" class="cert-input" id="cert_count_${cls}">`;
            weekCountRow.appendChild(tdCount);
        });
    }

    function updateSummaryWeek() {
        const week = document.getElementById("weekInput").value;
        document.getElementById("summaryWeekDisplay").innerText = week;
        refreshSummaryTableDisplay();
    }

    function saveRecord() {
        const week = document.getElementById("weekInput").value;
        const currentClass = document.getElementById("classSelect").value;
        const chkQuiet = document.getElementById("chkQuiet").checked;
        const chkBooks = document.getElementById("chkBooks").checked;
        const isPassed = chkQuiet && chkBooks;

        // 收集所有座位的下拉選單值
        const selectElements = document.querySelectorAll('.seat-select');
        const seatData = Array.from(selectElements).map(select => select.value);

        // 存入記憶體
        if (!records[week]) records[week] = {};
        records[week][currentClass] = { 
            passed: isPassed,
            chkQuiet: chkQuiet,
            chkBooks: chkBooks,
            seats: seatData,
            excWalk: document.getElementById("excWalk").value,
            excClean: document.getElementById("excClean").value,
            excStand: document.getElementById("excStand").value,
            excNotReady: document.getElementById("excNotReady").value,
            excOther: document.getElementById("excOther").value
        };

        // 更新底部總表
        refreshSummaryTableDisplay();

        // 顯示儲存成功提示
        const toast = document.getElementById('toast');
        toast.innerText = `已儲存第 ${week} 週 ${currentClass} 班紀錄！`;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }

    function loadClassRecord() {
        const week = document.getElementById("weekInput").value;
        const currentClass = document.getElementById("classSelect").value;
        
        // 檢查該週該班是否有歷史紀錄
        if (records[week] && records[week][currentClass]) {
            const data = records[week][currentClass];
            
            // 復原勾選狀態
            document.getElementById("chkQuiet").checked = data.chkQuiet;
            document.getElementById("chkBooks").checked = data.chkBooks;
            checkCertification();

            // 復原座位表狀態與顏色
            const selectElements = document.querySelectorAll('.seat-select');
            const seatContainers = document.querySelectorAll('.seat');
            
            data.seats.forEach((val, index) => {
                selectElements[index].value = val;
                const optColor = seatOptions.find(o => o.value === val).bg;
                seatContainers[index].style.backgroundColor = optColor;
            });

            // 復原其他特殊狀況數值
            document.getElementById("excWalk").value = data.excWalk;
            document.getElementById("excClean").value = data.excClean;
            document.getElementById("excStand").value = data.excStand;
            document.getElementById("excNotReady").value = data.excNotReady;
            document.getElementById("excOther").value = data.excOther;
            
        } else {
            // 無歷史紀錄則清空表單
            resetForm();
        }
    }

    function refreshSummaryTableDisplay() {
        const week = document.getElementById("weekInput").value;
        classes.forEach(cls => {
            const statusCell = document.getElementById(`pass_status_${cls}`);
            if (records[week] && records[week][cls] && records[week][cls].passed) {
                statusCell.innerHTML = '<span class="cert-check">✔</span>';
            } else {
                statusCell.innerHTML = '';
            }
        });
    }

    function resetForm() {
        document.getElementById("chkQuiet").checked = false;
        document.getElementById("chkBooks").checked = false;
        checkCertification();
        
        const selectElements = document.querySelectorAll('.seat-select');
        const seatContainers = document.querySelectorAll('.seat');
        
        selectElements.forEach((select, index) => {
            select.value = "正常";
            seatContainers[index].style.backgroundColor = "#ffffff";
        });

        document.getElementById("excWalk").value = 0;
        document.getElementById("excClean").value = 0;
        document.getElementById("excStand").value = 0;
        document.getElementById("excNotReady").value = 0;
        document.getElementById("excOther").value = "";
    }
</script>

</body>
</html>
`
