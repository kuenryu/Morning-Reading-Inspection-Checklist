<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>晨讀巡堂紀錄系統 (多使用者同步版)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --bg: #f8f9fa;
            --border: #dee2e6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--primary); margin: 0; padding: 20px; }
        .container { max-width: 1050px; margin: 0 auto; background: white; padding: 20px 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h3 { text-align: center; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .form-group { display: flex; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; padding: 15px; background: #f1f3f5; border-radius: 8px; }
        label { font-weight: bold; }
        select, input[type="text"], input[type="number"], input[type="date"] { padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 16px; }
        input[type="number"] { width: 60px; }
        .checkbox-group { display: flex; gap: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; margin-bottom: 20px; align-items: center; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 18px; cursor: pointer; }
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .certification-badge { display: none; background: var(--success); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .classroom-wrapper { position: relative; margin: 30px 0; padding: 20px 60px 20px 20px; border: 2px solid var(--border); border-radius: 8px; background: #f8f9fa; }
        .door { position: absolute; right: 0; width: 35px; height: 70px; background: #d35400; color: white; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; letter-spacing: 5px; font-weight: bold; border-radius: 4px 0 0 4px; box-shadow: -2px 0 5px rgba(0,0,0,0.1); }
        .front-door { top: 30px; } .back-door { bottom: 30px; }
        .blackboard { background: #2c3e50; color: white; text-align: center; padding: 8px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; letter-spacing: 5px; width: 70%; margin-left: auto; margin-right: auto; }
        .seating-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .seat { border: 1px solid #adb5bd; border-radius: 4px; padding: 4px; display: flex; flex-direction: column; align-items: center; background: #ffffff; transition: background-color 0.2s; }
        .seat-header { width: 100%; display: flex; justify-content: flex-end; margin-bottom: 3px; }
        .seat-label { font-size: 12px; color: #d35400; font-weight: bold; }
        .seat-select { width: 100%; font-size: 12px; padding: 1px; border: 1px solid #ccc; border-radius: 3px; background: rgba(255,255,255,0.9); }

        .exceptions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .exception-item { display: flex; flex-direction: column; gap: 5px; }
        .btn-save { display: block; width: 100%; background: var(--accent); color: white; border: none; padding: 15px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 30px; }
        .btn-save:hover { background: #2980b9; } .btn-save:disabled { background: #95a5a6; cursor: not-allowed; }
        .btn-export { display: block; width: 100%; background: var(--success); color: white; border: none; padding: 15px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 30px; }
        .btn-export:hover { background: #219653; }

        .summary-section { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; margin-top: 10px; }
        th, td { border: 1px solid var(--border); padding: 8px 4px; min-width: 40px; font-size: 14px; }
        th { background: #e9ecef; } .class-group-th { background: #ced4da; }
        .cert-check { font-size: 18px; color: var(--success); font-weight: bold; }
        .cert-input { width: 35px; text-align: center; border: 1px solid transparent; background: transparent; font-size: 14px; }
        .cert-input:hover, .cert-input:focus { border: 1px solid var(--accent); background: white; }
        
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: white; padding: 15px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10000; display: none; font-weight: bold; font-size: 1.2rem; animation: popIn 0.3s ease-out; white-space: nowrap; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 8px solid #f3f3f3; border-top: 8px solid var(--accent); border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <h2 style="color: #2c3e50;">正在從雲端載入全校紀錄...</h2>
</div>

<div id="toast">儲存成功！</div>

<div class="container">
    <h1>晨讀巡堂紀錄系統</h1>

    <div class="form-group">
        <label>第 <input type="number" id="weekInput" value="1" min="1" onchange="updateSummaryWeek(); loadClassRecord();"> 週</label>
        
        <label>巡視紀錄者：</label>
        <select id="inspectorSelect" onchange="toggleManualInspector()">
            <option value="校長">校長</option>
            <option value="教務主任">教務主任</option>
            <option value="學務主任">學務主任</option>
            <option value="生教組長">生教組長</option>
            <option value="課發組長">課發組長</option>
            <option value="manual">手動輸入...</option>
        </select>
        
        <input type="text" id="manualInspector" placeholder="請輸入姓名" style="display:none;" onblur="loadClassRecord()">
        <input type="date" id="manualDate" style="display:none;">

        <label style="margin-left: auto;">巡查班級：</label>
        <select id="classSelect" onchange="loadClassRecord()">
            <optgroup label="七年級"><option value="701">701</option><option value="702">702</option><option value="703">703</option><option value="704">704</option><option value="705">705</option><option value="706">706</option></optgroup>
            <optgroup label="八年級"><option value="801">801</option><option value="802">802</option><option value="803">803</option><option value="804">804</option><option value="805">805</option><option value="806">806</option></optgroup>
            <optgroup label="九年級"><option value="901">901</option><option value="902">902</option><option value="903">903</option><option value="904">904</option><option value="905">905</option><option value="906">906</option><option value="907">907</option></optgroup>
        </select>
    </div>

    <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" id="chkQuiet" onchange="checkCertification()"> 1. 全班安靜閱讀</label>
        <label class="checkbox-item"><input type="checkbox" id="chkBooks" onchange="checkCertification()"> 2. 全班閱讀課外讀物</label>
        <span class="certification-badge" id="certBadge">✓ 通過認證</span>
    </div>

    <div class="classroom-wrapper">
        <div class="door front-door">前門</div>
        <div class="blackboard">黑板 (正前方)</div>
        <div class="seating-grid" id="seatingGrid"></div>
        <div class="door back-door">後門</div>
    </div>

    <h3>班級特殊狀況統計</h3>
    <div class="exceptions-grid">
        <div class="exception-item"><label>走動人數</label><input type="number" id="excWalk" min="0" value="0"></div>
        <div class="exception-item"><label>打掃人數</label><input type="number" id="excClean" min="0" value="0"></div>
        <div class="exception-item"><label>站立人數</label><input type="number" id="excStand" min="0" value="0"></div>
        <div class="exception-item"><label>未就緒人數</label><input type="number" id="excNotReady" min="0" value="0"></div>
        <div class="exception-item" style="grid-column: span 2;"><label>其他</label><input type="text" id="excOther"></div>
    </div>

    <div style="display: flex; gap: 15px;">
        <button class="btn-save" id="btnSave" onclick="saveRecord()">儲存 / 雲端同步本班紀錄</button>
        <button class="btn-export" onclick="exportToExcel()">匯出本週紀錄至 Excel</button>
    </div>

    <div class="summary-section">
        <h3>第 <span id="summaryWeekDisplay">1</span> 週 <span id="summaryInspectorDisplay" style="color:var(--accent);">校長</span> 獲得認證獎狀統計表</h3>
        <table>
            <thead>
                <tr>
                    <th rowspan="2">班級</th>
                    <th colspan="6" class="class-group-th">七年級</th>
                    <th colspan="6" class="class-group-th">八年級</th>
                    <th colspan="7" class="class-group-th">九年級</th>
                </tr>
                <tr id="classHeaders"></tr>
            </thead>
            <tbody>
                <tr><td>本週通過認證</td></tr>
                <tr><td>通過認證週數<br>(第 __ 週)</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    // ====================================================
    // 請將下方替換為您【新增部署作業】後取得的全新網址
    // ====================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx_sahZErLgcRaKCSXJdkrPjwSxNhbCPr9MXuyf_dyqyUat3bQcmmA4w2ZxQwcvWH_d_Q/exec";
    
    const classes = ["701","702","703","704","705","706","801","802","803","804","805","806","901","902","903","904","905","906","907"];
    const seatOptions = [
        { value: "正常", label: "正常", bg: "#ffffff" }, { value: "看課內", label: "看課內", bg: "#ffeaa7" },
        { value: "寫考卷", label: "寫考卷", bg: "#55efc4" }, { value: "寫聯絡簿", label: "寫聯絡簿", bg: "#74b9ff" },
        { value: "睡覺", label: "睡覺", bg: "#a29bfe" }, { value: "桌上無書發呆", label: "桌上無書發呆", bg: "#ff7675" }
    ];

    // 資料結構變更為：records[week][inspector][class]
    let records = {};

    window.onload = async () => {
        initSeatingGrid();
        initSummaryTable();
        await fetchAllDataFromCloud();
    };

    function getInspector() {
        let inspector = document.getElementById("inspectorSelect").value;
        if (inspector === "manual") {
            inspector = document.getElementById("manualInspector").value.trim() || "手動輸入";
        }
        return inspector;
    }

    async function fetchAllDataFromCloud() {
        if(GAS_URL === "在此貼上您的Web_App_URL") {
            document.getElementById('loadingOverlay').style.display = 'none';
            return;
        }
        try {
            const response = await fetch(GAS_URL);
            const data = await response.json();
            records = data; 
            refreshSummaryTableDisplay();
            loadClassRecord(); 
        } catch (error) {
            console.error("讀取資料失敗", error);
            showToast("載入雲端資料失敗，請檢查網路連線", "#e74c3c");
        } finally {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
    }

    function toggleManualInspector() {
        const select = document.getElementById("inspectorSelect");
        const manualInput = document.getElementById("manualInspector");
        const manualDate = document.getElementById("manualDate");
        if (select.value === "manual") {
            manualInput.style.display = "inline-block";
            manualDate.style.display = "inline-block";
            manualInput.focus();
        } else {
            manualInput.style.display = "none";
            manualDate.style.display = "none";
            document.getElementById("manualDate").value = ""; 
        }
        loadClassRecord(); 
    }

    function checkCertification() {
        const chkQuiet = document.getElementById("chkQuiet").checked;
        const chkBooks = document.getElementById("chkBooks").checked;
        document.getElementById("certBadge").style.display = (chkQuiet && chkBooks) ? "inline-block" : "none";
    }

    function initSeatingGrid() {
        const grid = document.getElementById("seatingGrid");
        grid.innerHTML = "";
        for (let row = 1; row <= 5; row++) {
            for (let visualCol = 1; visualCol <= 6; visualCol++) {
                const seat = document.createElement("div"); seat.className = "seat";
                const logicalCol = 7 - visualCol; 
                const header = document.createElement("div"); header.className = "seat-header";
                const label = document.createElement("div"); label.className = "seat-label";
                label.innerText = `${logicalCol}-${row}`; header.appendChild(label);
                const select = document.createElement("select"); select.className = "seat-select";
                
                seatOptions.forEach(opt => {
                    const option = document.createElement("option"); option.value = opt.value; option.innerText = opt.label;
                    select.appendChild(option);
                });
                select.onchange = function() {
                    const selectedOpt = seatOptions.find(o => o.value === this.value);
                    seat.style.backgroundColor = selectedOpt.bg;
                };
                seat.appendChild(header); seat.appendChild(select); grid.appendChild(seat);
            }
        }
    }

    function initSummaryTable() {
        const headerRow = document.getElementById("classHeaders");
        const tbodyRows = document.querySelectorAll(".summary-section tbody tr");
        const passRow = tbodyRows[0]; const weekCountRow = tbodyRows[1];
        classes.forEach(cls => {
            const th = document.createElement("th"); th.innerText = cls; headerRow.appendChild(th);
            const tdPass = document.createElement("td"); tdPass.id = `pass_status_${cls}`; passRow.appendChild(tdPass);
            const tdCount = document.createElement("td"); tdCount.innerHTML = `<input type="text" class="cert-input">`; weekCountRow.appendChild(tdCount);
        });
    }

    function updateSummaryWeek() {
        document.getElementById("summaryWeekDisplay").innerText = document.getElementById("weekInput").value;
        refreshSummaryTableDisplay();
    }

    async function saveRecord() {
        const btn = document.getElementById("btnSave");
        btn.innerText = "雲端同步中..."; btn.disabled = true;

        const week = document.getElementById("weekInput").value;
        const currentClass = document.getElementById("classSelect").value;
        const inspector = getInspector();
        const manualDate = (document.getElementById("inspectorSelect").value === "manual") ? document.getElementById("manualDate").value : "";
        const chkQuiet = document.getElementById("chkQuiet").checked;
        const chkBooks = document.getElementById("chkBooks").checked;

        const selectElements = document.querySelectorAll('.seat-select');
        const seatData = Array.from(selectElements).map(select => select.value);

        const payload = {
            action: 'save', week: week, inspector: inspector, className: currentClass,
            passed: (chkQuiet && chkBooks), chkQuiet: chkQuiet, chkBooks: chkBooks,
            seats: seatData, manualDate: manualDate,
            excWalk: document.getElementById("excWalk").value, excClean: document.getElementById("excClean").value,
            excStand: document.getElementById("excStand").value, excNotReady: document.getElementById("excNotReady").value,
            excOther: document.getElementById("excOther").value
        };

        if (!records[week]) records[week] = {};
        if (!records[week][inspector]) records[week][inspector] = {};
        records[week][inspector][currentClass] = payload;
        refreshSummaryTableDisplay();

        if(GAS_URL === "在此貼上您的Web_App_URL") {
            showToast("請先設定 GAS_URL！已暫存於本機。", "#f1c40f");
            btn.innerText = "儲存 / 雲端同步本班紀錄"; btn.disabled = false;
            return;
        }

        try {
            await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
            showToast(`已成功同步【${inspector}】第 ${week} 週 <b>${currentClass}</b> 班紀錄！`);
        } catch (error) {
            console.error("儲存失敗", error);
            showToast("雲端同步失敗，但已暫存於本機。請檢查網路！", "#e74c3c");
        } finally {
            btn.innerText = "儲存 / 雲端同步本班紀錄"; btn.disabled = false;
        }
    }

    function loadClassRecord() {
        const week = document.getElementById("weekInput").value;
        const currentClass = document.getElementById("classSelect").value;
        const inspector = getInspector();
        
        document.getElementById("summaryInspectorDisplay").innerText = inspector;

        if (records[week] && records[week][inspector] && records[week][inspector][currentClass]) {
            const data = records[week][inspector][currentClass];
            document.getElementById("chkQuiet").checked = data.chkQuiet;
            document.getElementById("chkBooks").checked = data.chkBooks;
            checkCertification();

            const selectElements = document.querySelectorAll('.seat-select');
            const seatContainers = document.querySelectorAll('.seat');
            data.seats.forEach((val, index) => {
                selectElements[index].value = val;
                const optColor = seatOptions.find(o => o.value === val).bg;
                seatContainers[index].style.backgroundColor = optColor;
            });

            document.getElementById("excWalk").value = data.excWalk || 0;
            document.getElementById("excClean").value = data.excClean || 0;
            document.getElementById("excStand").value = data.excStand || 0;
            document.getElementById("excNotReady").value = data.excNotReady || 0;
            document.getElementById("excOther").value = data.excOther || "";
            
            if (data.manualDate) document.getElementById("manualDate").value = data.manualDate;
        } else {
            resetForm();
        }
        refreshSummaryTableDisplay();
    }

    function refreshSummaryTableDisplay() {
        const week = document.getElementById("weekInput").value;
        const inspector = getInspector();
        
        classes.forEach(cls => {
            const statusCell = document.getElementById(`pass_status_${cls}`);
            if (records[week] && records[week][inspector] && records[week][inspector][cls] && records[week][inspector][cls].passed) {
                statusCell.innerHTML = '<span class="cert-check">✔</span>';
            } else {
                statusCell.innerHTML = '';
            }
        });
    }

    function resetForm() {
        document.getElementById("chkQuiet").checked = false; document.getElementById("chkBooks").checked = false;
        checkCertification();
        const selectElements = document.querySelectorAll('.seat-select');
        const seatContainers = document.querySelectorAll('.seat');
        selectElements.forEach((select, index) => { select.value = "正常"; seatContainers[index].style.backgroundColor = "#ffffff"; });
        document.getElementById("excWalk").value = 0; document.getElementById("excClean").value = 0;
        document.getElementById("excStand").value = 0; document.getElementById("excNotReady").value = 0;
        document.getElementById("excOther").value = "";
    }

    function showToast(htmlMsg, bgColor = "#2ecc71") {
        const toast = document.getElementById('toast');
        toast.innerHTML = htmlMsg; toast.style.background = bgColor; toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2500);
    }

    function exportToExcel() {
        const week = document.getElementById("weekInput").value;
        const inspector = getInspector();

        if (!records[week] || !records[week][inspector] || Object.keys(records[week][inspector]).length === 0) {
            showToast(`第 ${week} 週【${inspector}】尚無任何巡堂紀錄，無法匯出！`, "#e74c3c");
            return;
        }

        const weekData = records[week][inspector];
        const exportData = [];
        const headers = [
            "班級", "巡查紀錄者", "手動輸入日期", "通過認證", "安靜閱讀", "閱讀課外讀物", 
            "走動人數", "打掃人數", "站立人數", "未就緒人數", "其他狀況"
        ];
        
        for (let row = 1; row <= 5; row++) {
            for (let visualCol = 1; visualCol <= 6; visualCol++) {
                const logicalCol = 7 - visualCol; 
                headers.push(`座位 ${logicalCol}-${row}`);
            }
        }
        exportData.push(headers);

        classes.forEach(cls => {
            if (weekData[cls]) {
                const data = weekData[cls];
                const rowData = [
                    cls, inspector, data.manualDate || "", data.passed ? "是" : "否",
                    data.chkQuiet ? "是" : "否", data.chkBooks ? "是" : "否",
                    data.excWalk, data.excClean, data.excStand, data.excNotReady, data.excOther || ""
                ];
                data.seats.forEach(seatStatus => rowData.push(seatStatus));
                exportData.push(rowData);
            }
        });

        const ws = XLSX.utils.aoa_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, `第${week}週紀錄`);
        XLSX.writeFile(wb, `晨讀巡堂_${inspector}_第${week}週.xlsx`);
    }
</script>

</body>
</html>
